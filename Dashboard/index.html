<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Arm Telemetry Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar/Left Panel for Connection & Control -->
        <aside class="sidebar-panel">
            <div class="brand-section">
                <div class="logo-glow"></div>
                <i data-lucide="cpu" class="brand-icon"></i>
                <h2>ARM-CORE v1.0</h2>
            </div>

            <!-- Connection Card -->
            <section class="glass-card connection-card">
                <h3><i data-lucide="power" class="card-icon cyan"></i> Connection</h3>
                <div class="control-group">
                    <label for="baudrate-select">Baud Rate</label>
                    <select id="baudrate-select">
                        <option value="115200" selected>115200</option>
                        <option value="9600">9600</option>
                        <option value="57600">57600</option>
                    </select>
                </div>
                <button id="connect-btn" class="btn primary-btn btn-glow-cyan">
                    <i data-lucide="unplug"></i> Connect UART
                </button>
                <div class="status-indicator">
                    <span class="status-dot disconnected" id="conn-dot"></span>
                    <span id="conn-text" class="status-text">Disconnected</span>
                </div>
            </section>

            <!-- Command Control Card -->
            <section class="glass-card control-card">
                <h3><i data-lucide="sliders" class="card-icon purple"></i> Controller</h3>
                
                <div class="control-group">
                    <label for="target-input">Target Position (Degrees)</label>
                    <div class="input-with-unit">
                        <input type="number" id="target-input" value="0.0" step="0.1" placeholder="0.0">
                        <span class="unit">°</span>
                    </div>
                </div>

                <div class="presets-grid">
                    <button class="preset-btn" data-val="0">0°</button>
                    <button class="preset-btn" data-val="45">45°</button>
                    <button class="preset-btn" data-val="90">90°</button>
                    <button class="preset-btn" data-val="180">180°</button>
                    <button class="preset-btn" data-val="-90">-90°</button>
                    <button class="preset-btn" data-val="-180">-180°</button>
                </div>

                <div class="control-group">
                    <label>Direction</label>
                    <div class="radio-toggle">
                        <input type="radio" id="dir-forward" name="direction" value="1.0" checked>
                        <label for="dir-forward"><i data-lucide="chevrons-right"></i> Forward (+1.0)</label>
                        
                        <input type="radio" id="dir-reverse" name="direction" value="-1.0">
                        <label for="dir-reverse"><i data-lucide="chevrons-left"></i> Reverse (-1.0)</label>
                    </div>
                </div>

                <button id="execute-btn" class="btn success-btn btn-glow-pink" disabled>
                    <i data-lucide="play"></i> EXECUTE MOVE
                </button>
            </section>

            <!-- Data Logging Card -->
            <section class="glass-card logging-card">
                <h3><i data-lucide="database" class="card-icon pink"></i> Data Logger</h3>
                <div class="logger-controls">
                    <button id="log-toggle-btn" class="btn secondary-btn" disabled>
                        <i data-lucide="circle-dot" class="text-danger"></i> Start Record
                    </button>
                    <button id="log-export-btn" class="btn secondary-btn" disabled>
                        <i data-lucide="download"></i> Export CSV
                    </button>
                </div>
                <div class="stats-row">
                    <div>
                        <span class="stat-label">Logged Points</span>
                        <span id="logged-count" class="stat-val">0</span>
                    </div>
                    <div>
                        <span class="stat-label">Status</span>
                        <span id="logger-status" class="stat-val status-inactive">Idle</span>
                    </div>
                </div>
            </section>
        </aside>

        <!-- Main Panel for Telemetry Readouts and Charts -->
        <main class="main-panel">
            <!-- Telemetry Digital Readout Grid -->
            <section class="telemetry-grid">
                <!-- Position Card -->
                <div class="glass-card telemetry-card glow-cyan">
                    <div class="telemetry-meta">
                        <span>POSITION</span>
                        <i data-lucide="gauge"></i>
                    </div>
                    <div class="telemetry-value">
                        <span id="val-position">0.000</span><span class="telemetry-unit">°</span>
                    </div>
                    <div class="telemetry-footer text-cyan">
                        <i data-lucide="trending-up"></i> Live encoder feedback
                    </div>
                </div>

                <!-- Velocity Card -->
                <div class="glass-card telemetry-card glow-blue">
                    <div class="telemetry-meta">
                        <span>VELOCITY</span>
                        <i data-lucide="activity"></i>
                    </div>
                    <div class="telemetry-value">
                        <span id="val-velocity">0.000</span><span class="telemetry-unit">°/s</span>
                    </div>
                    <div class="telemetry-footer text-blue">
                        <i data-lucide="sparkles"></i> Kalman filtered state
                    </div>
                </div>

                <!-- MCU Target Echo Card -->
                <div class="glass-card telemetry-card glow-purple">
                    <div class="telemetry-meta">
                        <span>MCU TARGET</span>
                        <i data-lucide="target"></i>
                    </div>
                    <div class="telemetry-value">
                        <span id="val-target">0.000</span><span class="telemetry-unit">°</span>
                    </div>
                    <div class="telemetry-footer text-purple">
                        <i data-lucide="refresh-cw"></i> Real-time variable echo
                    </div>
                </div>

                <!-- Move Trigger Echo Card -->
                <div class="glass-card telemetry-card glow-pink">
                    <div class="telemetry-meta">
                        <span>MOVE TRIGGER</span>
                        <i data-lucide="rocket"></i>
                    </div>
                    <div class="telemetry-value text-mono">
                        <span id="val-trigger">IDLE</span>
                    </div>
                    <div class="telemetry-footer text-pink">
                        <i data-lucide="info"></i> TRIGGER_execute_move status
                    </div>
                </div>
            </section>

            <!-- Charting Section -->
            <section class="glass-card chart-container-card">
                <div class="chart-header">
                    <h3><i data-lucide="line-chart" class="card-icon cyan"></i> Real-Time Telemetry Plots</h3>
                    <div class="chart-controls">
                        <select id="time-window-select" class="dropdown-small">
                            <option value="5000">5 Seconds</option>
                            <option value="10000" selected>10 Seconds</option>
                            <option value="20000">20 Seconds</option>
                            <option value="30000">30 Seconds</option>
                        </select>
                        <button id="pause-chart-btn" class="icon-btn" title="Pause Chart rendering">
                            <i data-lucide="pause"></i>
                        </button>
                        <button id="clear-chart-btn" class="icon-btn" title="Clear Chart history">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </div>
                </div>
                
                <div class="charts-wrapper">
                    <div class="chart-box">
                        <canvas id="positionChart"></canvas>
                    </div>
                    <div class="chart-box">
                        <canvas id="velocityChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Script loading -->
    <script src="app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
